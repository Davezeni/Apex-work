# Gitleaks config for Apex-Work.
#
# Keep gitleaks' secure-by-default rules (`useDefault = true`) and add only
# targeted allowlists for *known false positives*. CI scans the working tree
# (`--no-git`), so any secret committed going forward is still caught; we do
# NOT scan full git history here because once-committed secrets were already
# remediated (replaced with GitHub Actions `secrets.*`) and would otherwise
# fail the build forever.
[extend]
useDefault = true

[allowlist]
description = "non-secrets: lockfile integrity hashes, Redis/DB key names, and the CI build's dummy JWT placeholder"
paths = ['''package-lock\.json''', '''kpiWatcher\.service\.ts''']
regexes = ['''(pending|failed)Withdrawals\d{1,3}''', '''ci-secret-must-be-at-least-32-chars-long''']
