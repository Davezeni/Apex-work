name: Cron jobs

# Run the saved-search scanner every 15 minutes. Cheap, idempotent — worst
# case a scan is skipped and the next tick catches up.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run all cron workers
        env:
          TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CRON_TOKEN GitHub Actions secret is not configured"
            exit 1
          fi
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/out -w "%{http_code}" --max-time 180 \
              -H "Authorization: Bearer $TOKEN" \
              https://apex-work-api.onrender.com/v1/cron/tick || echo "000")
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/out || true
              exit 0
            fi
            sleep 10
          done
          echo "All attempts failed — will retry next tick"
