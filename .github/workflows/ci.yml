name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Open-source gitleaks (free) scans the full git history for leaked
      # secrets. Uses the standalone binary so it needs no account/license and
      # never uploads anything off this runner.
      - name: Install gitleaks
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --verbose

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace @apex-work/api run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check:changed


  test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  e2e:
    name: E2E smoke (live deploy)
    runs-on: ubuntu-latest
    # Runs against the live web + API on CI push. Optional — won't fail the
    # pipeline if the free Render dyno is cold-starting (it may take >60s).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace @apex-work/web run test:e2e:install
      - run: npm run test:e2e
        env:
          E2E_WEB_URL: https://apex-work-gold.vercel.app

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace @apex-work/api run db:generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          JWT_SECRET: ci-secret-must-be-at-least-32-chars-long
          NEXT_PUBLIC_API_URL: http://localhost:4000
