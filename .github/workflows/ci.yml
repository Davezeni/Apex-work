name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas changed? Gates the expensive jobs so an asset-only or
  # docs-only push costs ~20s instead of ~15 runner-minutes (the repo is
  # PRIVATE — Actions minutes are metered, 2,000 free/month).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - '.github/workflows/ci.yml'
            deps:
              - '**/package.json'
              - '**/package-lock.json'

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Open-source gitleaks (free) scans the full git history for leaked
      # secrets. Uses the standalone binary so it needs no account/license and
      # never uploads anything off this runner.
      - name: Install gitleaks
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        # `--no-git`: scan the current working tree, not full history. Once-committed
        # secrets were already remediated (replaced with `secrets.*`); scanning the
        # tree still catches any secret committed going forward.
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --no-banner --verbose

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Fails the build only for HIGH/CRITICAL advisories in production deps.
      # Works straight off package-lock.json — no install needed.
      - run: npm audit --omit=dev --audit-level=high

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace @apex-work/api run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check:changed

  # Clean CI against a REAL Postgres + Redis, with the money-migration applied
  # and the DB-level financial idempotency guarantee verified.
  test:
    name: API tests (Node 24 + Postgres + Redis)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apex
      # schema.prisma directUrl — same value locally (no pooling in CI)
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/apex
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-that-is-long-enough-for-hmac
      # Chapa sandbox config — public/private keys used by tests that touch
      # payment init; keep the private key as a repo secret, not committed.
      CHAPA_PUBLIC_KEY: ${{ secrets.CHAPA_PUBLIC_KEY }}
      CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
      CHAPA_ENCRYPTION_KEY: ${{ secrets.CHAPA_ENCRYPTION_KEY }}
      CHAPA_WEBHOOK_SECRET: ${{ secrets.CHAPA_WEBHOOK_SECRET }}
      CHAPA_TRANSFERS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace @apex-work/api run db:generate
      # Apply all migrations against the real Postgres service so the money
      # schema (incl. the financial idempotency unique index) is exercised.
      - name: Apply migrations (Postgres)
        run: npm --workspace @apex-work/api run db:migrate:deploy
      # Verify the DB-level guarantee that makes double-crediting impossible.
      - name: DB financial idempotency check
        run: node scripts/db-idempotency-check.mjs
      - name: API unit tests
        run: npm run test

  e2e:
    name: E2E smoke (live deploy)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Runs against the live web + API on CI push. Optional — won't fail the
    # pipeline if the free Render dyno is cold-starting (it may take >60s).
    steps:
      # The push that triggered CI also redeployed the API — wait for the
      # restart window to close so readiness checks don't race the deploy.
      - name: Wait for live API to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 10 https://apex-work-api.onrender.com/v1/ready | grep -q '"ready":true'; then
              echo "API ready after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "API not ready after 600s"; exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace @apex-work/web run test:e2e:install
      - run: npm run test:e2e
        env:
          E2E_WEB_URL: https://apex-work-gold.vercel.app

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint-typecheck, test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace @apex-work/api run db:generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          JWT_SECRET: ci-secret-must-be-at-least-32-chars-long
          NEXT_PUBLIC_API_URL: http://localhost:4000
