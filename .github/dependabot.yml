# Dependabot — free, automatic dependency updates.
# Keeps the free-tier stack current and patches known vulnerabilities.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Zero-cost guardrail: never bump major versions silently behind the scenes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
