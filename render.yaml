# Render Blueprint — deploys the Apex-Work API.
# Docs: https://render.com/docs/blueprint-spec
#
# One-click deploy: connect this repo in Render dashboard, and Render will
# detect this file and provision the service automatically.

services:
  - type: web
    name: apex-work-api
    runtime: node
    plan: free # 512 MB RAM, sleeps after 15 min idle
    region: frankfurt # Closest to Ethiopia
    branch: main
    autoDeploy: true

    # Build: install deps, build shared, generate Prisma client, compile API
    buildCommand: |
      npm ci --include=dev
      npm --workspace @apex-work/shared run build
      npm --workspace @apex-work/api run db:generate
      npm --workspace @apex-work/api run build

    # Apply pending Prisma migrations against the live DB BEFORE the new code
    # starts. Migrations use the direct (unpooled) connection when provided,
    # falling back to the pooled DATABASE_URL. This closes the gap where builds
    # shipped a new schema without the matching DB changes.
    preDeployCommand: |
      DATABASE_URL="${DATABASE_URL_UNPOOLED:-$DATABASE_URL}" \
        npm --workspace @apex-work/api run db:migrate:deploy

    # Start: run the compiled server
    startCommand: node apps/api/dist/server.js

    # Render sets PORT automatically; our server reads it
    healthCheckPath: /v1/health

    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false" # keep devDeps for prisma generate & tsc

      # Secrets — set these in the Render dashboard, do NOT commit values here
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render generates a secure random value
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ORIGINS
        value: https://apex-work-gold.vercel.app,http://localhost:3000
      - key: API_URL
        value: https://apex-work-api.onrender.com
      - key: WEB_URL
        value: https://apex-work-gold.vercel.app
      - key: AFROMESSAGE_API_KEY
        sync: false
      - key: AFROMESSAGE_IDENTIFIER_ID
        sync: false
        # Beta accounts: leave unset. AfroMessage uses their default shortcode.
        # Paid accounts: set to your assigned short-code (NOT the account UUID).
      - key: AFROMESSAGE_SENDER
        sync: false
        # Beta accounts: leave unset. Paid accounts: set to your approved
        # sender name (e.g. 'ApexWork'). Sender registration takes 1-2 days.
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_ENCRYPTION_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        # Set to the value shown in Chapa dashboard when you configure the
        # webhook URL. Leave empty in test mode; production should always have one.
        sync: false
      - key: CHAPA_TRANSFERS_ENABLED
        value: "false" # Enable only after verifying Chapa transfer bank codes in sandbox.

      # OAuth sign-in credentials are entered in the Render dashboard; never commit values.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

      # WebAuthn / passkeys — must exactly match the web app's origin.
      # RP_ID = the domain (no scheme, no port). RP_ORIGIN = the full https origin.
      # Update these if you move to a custom domain.
      - key: WEBAUTHN_RP_ID
        value: apex-work-gold.vercel.app
      - key: WEBAUTHN_RP_ORIGIN
        value: https://apex-work-gold.vercel.app
      - key: WEBAUTHN_RP_NAME
        value: Apex-Work

      # Supabase Storage (portfolio images, chat attachments, avatars).
      # Keep both keys in the Render dashboard. The service-role key is
      # privileged and the anon key identifies the project; neither belongs
      # in this tracked Blueprint file.
      - key: SUPABASE_URL
        value: https://zjkeuwghphutnuyxwmaa.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # LLM (Groq — free tier). Get a key from https://console.groq.com
      # Powers /v1/ai/* (proposal writer, brief generator, resume enhance,
      # voice transcription). App still works without it — it falls back
      # to a deterministic local generator.
      - key: GROQ_API_KEY
        sync: false

      # Web Push (VAPID). Keep the key pair in Render; the private key must
      # never be committed. Generate a fresh pair before a real launch with:
      #   npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@apex-work.com

      # Cron token — protects /v1/cron/* endpoints called by GitHub Actions
      # every 15 minutes to run the saved-search scanner. Keep it in both
      # hosting dashboards as a secret, never in this file.
      - key: CRON_TOKEN
        sync: false
